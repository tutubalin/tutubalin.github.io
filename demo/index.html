<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Project</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f2f3f7;
      color: #191c25;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0e1013; color: #e8eaef; }
    }
    .card { max-width: 520px; padding: 32px; }
    .card .emoji { font-size: 56px; }
    .card h1 { font-size: 28px; margin: 16px 0 8px; letter-spacing: -0.02em; }
    .card p { color: #69707d; line-height: 1.6; margin: 0 0 24px; }
    @media (prefers-color-scheme: dark) {
      .card p { color: #98a0ad; }
    }
    .card a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 12px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .card a:hover { background: #5458e8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>Demo Project</h1>
    <p>
      This folder is a sample project. Replace <code>demo/</code> with your own work —
      each project can be a fully independent page with its own styles and scripts.
    </p>
    <a href="../">← Back to homepage</a>
  </div>
</body>
</html>
